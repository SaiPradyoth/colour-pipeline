<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spectral Color Pipeline</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-3">Spectral → Color → ΔE Analyzer</h1>
    <p class="text-muted">
      Upload a 96-well plate spectrometer dataset (.xlsx).
      The system will compute CIE XYZ, CIE Lab, and ΔE values.
    </p>

    <form method="post" enctype="multipart/form-data" class="mb-4">
      <div class="mb-3">
        <label for="dataset" class="form-label">Excel File (.xlsx)</label>
        <input type="file"
               class="form-control"
               id="dataset"
               name="dataset"
               accept=".xlsx"
               required>
      </div>
      <button type="submit" class="btn btn-primary">
        Run Pipeline
      </button>
    </form>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    {% if table_html %}
      <hr>
      <h2>Results</h2>
      <p class="text-muted">ΔE is relative to the reference well.</p>
      <div class="table-responsive">
        {{ table_html|safe }}
      </div>
    {% endif %}
  </div>
</body>
</html>
