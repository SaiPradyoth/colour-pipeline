<section id="page-spectral" class="page-section">

  {% if table_html %}

    <!-- ===============================
         SPECTRAL CURVES (ACTIVE STATE)
    ================================ -->
    <div class="card-elevated mb-4">
      <h5 class="card-title">Spectral curves</h5>
      <p class="card-subtitle">
        Overlay multiple wells. Use checkboxes for easier selection.
      </p>

      <div class="row g-3 mt-3">

        <!-- LEFT: WELL SELECTION -->
        <div class="col-md-4">
          <label class="small fw-bold">Select wells</label>

          <div id="spectral-checkbox-list"
               class="border rounded p-2"
               style="max-height:260px; overflow:auto;">

            {% for w in detected_wells | default([]) %}
              <div class="form-check small">
                <input
                  class="form-check-input spectral-well"
                  type="checkbox"
                  value="{{ w }}"
                  id="well_{{ w }}">
                <label class="form-check-label" for="well_{{ w }}">
                  {{ w }}
                </label>
              </div>
            {% endfor %}

          </div>

          <button id="spectral-plot-btn"
                  class="btn btn-primary btn-sm mt-2"
                  type="button">
            Plot spectra
          </button>

          <div class="d-flex flex-wrap gap-2 mt-3">
            <button id="spectral-download-btn"
                    class="btn btn-outline-secondary btn-sm"
                    type="button">
              Download PNG
            </button>

            <button id="spectral-print-btn"
                    class="btn btn-outline-secondary btn-sm"
                    type="button">
              Print graph
            </button>
          </div>

          <input type="hidden"
                 id="fileToken"
                 value="{{ file_token | default('') }}">

          <p id="spectral-status" class="small mt-2 text-muted">
            Select wells and click “Plot spectra”.
          </p>
        </div>

        <!-- RIGHT: CHART -->
        <div class="col-md-8">
          <div id="spectral-chart-container">
            <canvas id="spectral-chart"></canvas>
          </div>
        </div>

      </div>
    </div>

  {% else %}

    <!-- ===============================
         EMPTY / PRE-UPLOAD STATE
    ================================ -->
    <div class="card-elevated">
      <h5 class="card-title">Spectral curves</h5>
      <p class="small text-muted mb-0">
        Upload a dataset on the Dashboard to view spectral curves.
      </p>
    </div>

  {% endif %}

</section>
